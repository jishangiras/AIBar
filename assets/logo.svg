<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="120" rx="16" fill="url(#bg)"/>
  <rect width="480" height="120" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Bar chart icon -->
  <g transform="translate(28, 24)">
    <!-- Bars -->
    <rect x="0"  y="44" width="12" height="8"  rx="3" fill="url(#red)"    filter="url(#glow)" opacity="0.9"/>
    <rect x="16" y="28" width="12" height="24" rx="3" fill="url(#yellow)" filter="url(#glow)" opacity="0.9"/>
    <rect x="32" y="8"  width="12" height="44" rx="3" fill="url(#green)"  filter="url(#glow)" opacity="0.9"/>
    <!-- Status dots -->
    <circle cx="6"  cy="38" r="3" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="22" cy="22" r="3" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="38" cy="2"  r="3" fill="#22c55e" filter="url(#glow)"/>
  </g>

  <!-- Wordmark -->
  <text x="104" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-weight="700" font-size="38" fill="#f0f0f0" letter-spacing="-1">AIBar</text>

  <!-- Tagline -->
  <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif"
        font-weight="400" font-size="13" fill="rgba(240,240,240,0.38)" letter-spacing="0.2">
    Monitor your AI API rate limits from the menu bar
  </text>
</svg>
